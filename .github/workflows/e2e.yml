name: CI

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  release-directus-compatibility:
    name: Release Directus compatibility
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare candidate with the release base
        env:
          BASE_REF: origin/release
          DEPLOY_ENV_FILE: ${{ github.workspace }}/.env.production.example
        run: scripts/deploy/verify-release-directus-compatibility.sh

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production web image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_SITE_URL=https://globalchurch.kr
          --tag global-church-page-web:ci
          .

  deployment-preflight:
    name: Deployment preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment signature without host Node.js
        run: scripts/deploy/test-directus-service-signature.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
